name: AI Concierge branch verification
on:
  push:
    branches:
      - main
      - feature/ai-concierge-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Concierge offline worker behavior tests
        run: node --test tests/ai-concierge-worker.test.mjs
      - name: Check publishing uses the canonical knowledge-generating build
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const config=fs.readFileSync('netlify.toml','utf8');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(!config.includes('command = '+String.fromCharCode(34)+'npm run build'+String.fromCharCode(34)))throw Error('Site publishing bypasses the canonical build script');
          if(!pkg.scripts.build?.includes('build-concierge-knowledge.mjs'))throw Error('Concierge knowledge generator is not in canonical build');
          console.log('PASS: publishing uses the canonical build and generates the listing feed');
          "
      - name: Concierge API integration tests (mock database; no production writes)
        run: node --test tests/ai-concierge-api.test.mjs
      - name: Production build
        if: always()
        run: npm run build
      - name: Verify build contains the public property reference feed
        shell: bash
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('dist/concierge-knowledge.json','utf8'));
          if(data.schema_version!==1 || !Array.isArray(data.listings) || !data.listings.length)throw Error('Missing listing reference feed');
          if(data.listings.some(x=>x.status==='placeholder'))throw Error('Illustrative listing entered reference feed');
          if(data.listings.some(x=>!x.url.startsWith('https://missydours.com/listings/')))throw Error('Untrusted listing URL');
          console.log('Verified published build includes',data.listings.length,'non-placeholder listing records');
          "
      - name: Audit published Concierge knowledge URL (read-only, report-only)
        continue-on-error: true
        run: node scripts/probe-concierge-production.mjs
      - name: External Cloudflare health smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            'https://missy-concierge-foundation.gta-alpha-activities.workers.dev/health' \
            -o /tmp/concierge-health.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/concierge-health.json'))
          assert x.get('status')=='ready'
          assert x.get('ai') is True
          assert x.get('messageEndpointConfigured') is True
          print('Worker health and bindings verified')
          PY
      - name: Reject origin-less Supabase requests
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /tmp/concierge-api.json -w '%{http_code}' -X POST \
            'https://ddgpsvkmrnfeufepowog.supabase.co/functions/v1/concierge-api/session' \
            -H 'Content-Type: application/json' -d '{"challenge":"invalid-test-token"}')
          test "$status" = 403 -o "$status" = 401
          echo "API correctly rejected untrusted-origin request with HTTP $status"
      - name: Confirm visitor chat remains disabled before launch
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /tmp/concierge-disabled.json -w '%{http_code}' -X POST \
            'https://ddgpsvkmrnfeufepowog.supabase.co/functions/v1/concierge-api/session' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://missydours.com' \
            -d '{"challenge":"invalid-test-token"}')
          test "$status" = 503
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/concierge-disabled.json'))
          assert 'not available yet' in x.get('error',''), 'Unexpected error; feature flag may not be disabled'
          print('PASS: server-side concierge flag is still disabled')
          PY
      - name: Confirm visitor file uploads are disabled before launch
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /tmp/concierge-upload-disabled.json -w '%{http_code}' -X POST \
            'https://ddgpsvkmrnfeufepowog.supabase.co/functions/v1/concierge-api/attachment-upload' \
            -H 'Content-Type: application/octet-stream' \
            -H 'Origin: https://missydours.com' \
            -H 'X-File-Name: sample.pdf' \
            -H 'X-File-Type: application/pdf' \
            --data-binary '%PDF-')
          test "$status" = 503
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/concierge-upload-disabled.json'))
          assert 'not available yet' in x.get('error','')
          print('PASS: private attachments remain inaccessible while public chat is off')
          PY
      - name: Reject anonymous staff device readiness while visitor chat is disabled
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /tmp/concierge-readiness-denied.json -w '%{http_code}' -X POST \
            'https://ddgpsvkmrnfeufepowog.supabase.co/functions/v1/concierge-api/staff-readiness' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://missydours.com' \
            -d '{}')
          test "$status" = 401
          python3 - <<'PY'
          import json
          payload=json.load(open('/tmp/concierge-readiness-denied.json'))
          assert payload.get('error') == 'Unauthorized'
          print('PASS: staff readiness cannot be read anonymously')
          PY
      - name: Reject unauthenticated staff translation while visitor chat is disabled
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /tmp/concierge-staff-denied.json -w '%{http_code}' -X POST \
            'https://ddgpsvkmrnfeufepowog.supabase.co/functions/v1/concierge-api/staff-translate' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://missydours.com' \
            -d '{"conversation_id":"00000000-0000-0000-0000-000000000000","message":"test"}')
          test "$status" = 401
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/concierge-staff-denied.json'))
          assert x.get('error')=='Unauthorized'
          print('PASS: staff translation rejects unauthenticated callers even with public chat disabled')
          PY
      - name: Reject unauthorized AI Worker requests
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /tmp/worker-denied.json -w '%{http_code}' -X POST \
            'https://missy-concierge-foundation.gta-alpha-activities.workers.dev/internal/reply' \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"security check"}]}')
          test "$status" = 401
          echo "PASS: Worker rejects unauthenticated AI inference"
      - name: Confirm background push sender is disabled
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /tmp/push-disabled.json -w '%{http_code}' -X POST \
            'https://ddgpsvkmrnfeufepowog.supabase.co/functions/v1/concierge-push-delivery' \
            -H 'Content-Type: application/json' -d '{}')
          test "$status" = 503
          python3 - <<'PY'
          import json
          response=json.load(open('/tmp/push-disabled.json'))
          assert response.get('status')=='disabled', 'Background push must remain disabled'
          print('PASS: background push delivery remains disabled')
          PY
