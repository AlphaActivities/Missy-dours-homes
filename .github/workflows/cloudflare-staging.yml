name: Cloudflare staging deployment
on:
  push:
    branches: [preview/cloudflare]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/preview/cloudflare'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    defaults:
      run:
        working-directory: preview/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/cloudflare/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Validate staging target
        run: |
          node -e 'const c=require("./wrangler.json"); if(c.name!=="missy-crm-review" || c.routes || c.route || c.env || c.keep_vars!==true || c.preview_urls!==false || c.assets?.run_worker_first!==true) process.exit(1)'
          node --check gateway.mjs
          npx --no-install wrangler deploy --dry-run --config wrangler.json
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config wrangler.json --name missy-crm-review
