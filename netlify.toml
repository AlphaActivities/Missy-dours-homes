[[redirects]]
from = "/favicon.ico"
to = "/images/Favicons/favicon.ico"
status = 301
force = true

# Dashboard/admin routes → admin HTML shell (must come before the generic /* fallback)
[[redirects]]
from = "/dashboard"
to = "/admin.html"
status = 200

[[redirects]]
from = "/dashboard/*"
to = "/admin.html"
status = 200

# Generic SPA fallback for all public routes
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build]
command = "npx vite build"
publish = "dist"

# noindex/nofollow for the exact /dashboard route
[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# noindex/nofollow for all /dashboard/* sub-routes
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
